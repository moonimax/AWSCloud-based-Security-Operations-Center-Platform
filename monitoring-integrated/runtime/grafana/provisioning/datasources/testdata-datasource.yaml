# ATT&CK 매트릭스의 고정 커버리지 표(TestData CSV)를 읽는 데이터소스
# 위치: grafana-13.2.2\conf\provisioning\datasources\testdata-datasource.yaml  → Grafana 재시작
apiVersion: 1
datasources:
  - name: TestData-Sentinel
    type: grafana-testdata-datasource
    uid: testdata                    # attack-coverage.json 이 이 uid 를 참조
    access: proxy
    editable: false
