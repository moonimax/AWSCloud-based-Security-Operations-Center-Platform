apiVersion: 1
providers:
  - name: integrated
    folder: Security Lab
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
  - name: sentinel-managed
    folder: Sentinel
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 15
    options:
      path: /var/lib/grafana/sentinel-dashboards
