name: monitoring-integrated
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  init-storage:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data/loki /data/grafana /data/dashboards && chown 10001:10001 /data/loki && chown 472:472 /data/grafana && chmod 755 /data/dashboards"]
    volumes: ["${DATA_ROOT:-./data}:/data"]
    logging: *logging
  loki:
    image: grafana/loki:3.7.7
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - ${DATA_ROOT:-./data}/loki:/tmp/loki
    depends_on:
      init-storage:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging
  worker:
    profiles: [aws]
    stop_grace_period: 90s
    build: ./worker
    environment:
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      QUEUE_URL: ${QUEUE_URL:-}
      LOKI_URL: http://loki:3100
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [loki]
    restart: unless-stopped
    logging: *logging
  agent:
    build: ./agent
    environment:
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
      BEDROCK_ANALYSIS_MODEL_ID: ${BEDROCK_ANALYSIS_MODEL_ID:-}
      BUNDLED_DASHBOARDS: /bundled-dashboards
      MANAGED_DASHBOARDS: /managed-dashboards
      LOKI_URL: http://loki:3100
    volumes:
      - ./grafana/dashboards:/bundled-dashboards:ro
      - ${DATA_ROOT:-./data}/dashboards:/managed-dashboards:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      loki:
        condition: service_started
      init-storage:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging
  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_SERVER_ROOT_URL: http://localhost:8080/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/multilog.json
      GF_LIVE_MAX_CONNECTIONS: "0"
    volumes:
      - ${DATA_ROOT:-./data}/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${DATA_ROOT:-./data}/dashboards:/var/lib/grafana/sentinel-dashboards:ro
      - type: bind
        source: ./secrets/grafana-password
        target: /run/secrets/grafana_password
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      init-storage:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging
  gateway:
    image: nginx:1.28.0-alpine
    ports: ["${GATEWAY_BIND:-127.0.0.1}:8080:8080"]
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ./secrets/htpasswd
        target: /etc/nginx/htpasswd
        read_only: true
        bind:
          create_host_path: false
    depends_on: [agent, grafana]
    restart: unless-stopped
    logging: *logging
